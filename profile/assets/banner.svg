<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#120c24" />
      <stop offset="100%" stop-color="#180b30" />
    </linearGradient>
    
    <!-- Accent Glows -->
    <radialGradient id="glow-violet" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logo-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <filter id="shadow-logo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>

    <!-- Border Glow -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#glow-violet)" />
  <rect width="1200" height="360" rx="16" fill="url(#glow-cyan)" />

  <!-- Subtle Ambient Grid lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Outer Card Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Logo Mark -->
  <g transform="translate(100, 105)" filter="url(#shadow-logo)">
    <rect width="150" height="150" rx="42" fill="url(#logo-grad)" />
    <text x="75" y="98" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Playfair Display', serif" font-weight="700" font-size="94" letter-spacing="-3">O</text>
    <circle cx="112" cy="38" r="9" fill="#e9d5ff" />
  </g>

  <!-- Content Group -->
  <g transform="translate(300, 0)">
    <!-- Badge -->
    <g transform="translate(0, 85)">
      <rect width="210" height="30" rx="15" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#a855f7" />
      <text x="28" y="19" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1">ENTERPRISE SAAS SUITE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="800" font-size="54" letter-spacing="-1.5">
      Orux <tspan fill="#a855f7">Solutions</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="205" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="400">
      Arquitectura modular multi-tenant de alto rendimiento para gestión integral de negocios.
    </text>

    <!-- Architecture & Capability Tags -->
    <g transform="translate(0, 245)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="138" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">🔒 Tenant-Scoped</text>

      <!-- Tag 2 -->
      <rect x="150" y="0" width="168" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="164" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">⚡ NestJS + React 19</text>

      <!-- Tag 3 -->
      <rect x="330" y="0" width="176" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="344" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">🧩 Dynamic Modules</text>

      <!-- Tag 4 -->
      <rect x="518" y="0" width="138" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="532" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">🚀 CI/CD Automated</text>
    </g>
  </g>
</svg>
